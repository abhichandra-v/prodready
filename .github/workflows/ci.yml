name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o prodready .
      - name: Dogfood — scan this repo's examples
        run: ./prodready --min high examples/ || true
